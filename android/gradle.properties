# Vex Launcher - Gradle ayarları
#
# Not: Düşük belleğe sahip makinelerde -Xmx değeri düşürülebilir
# (ör. -Xmx1024m). Kaynak: README.md -> "Yapılandırma ve bellek notları".
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# Kotlin
kotlin.code.style=official
# Kotlin derleyicisi ayrı bir JVM yerine Gradle süreci içinde çalışır; bellek tasarrufu sağlar.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
